apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunecloud-client
spec:
  replicas: {{ .Values.client.replicas }}
  selector:
    matchLabels:
      app: tunecloud-client
  template:
    metadata:
      labels:
        app: tunecloud-client
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: tunecloud-client
          image: {{ .Values.client.image }}
          ports:
            - containerPort: 80
